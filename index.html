
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070817">
    <title>Hola Mundo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 45%,
                    #19143c 0%, #0b0d24 42%, #050610 100%);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        /* Fondo animado */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            width: 40vw;
            height: 40vw;
            min-width: 280px;
            min-height: 280px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            animation: float 12s ease-in-out infinite alternate;
        }

        .orb-one {
            top: -15%;
            left: -10%;
            background: #713cff;
        }

        .orb-two {
            bottom: -20%;
            right: -10%;
            background: #00c8ff;
            animation-delay: -6s;
        }

        /* Partículas */
        .particles {
            position: absolute;
            inset: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #b8c8ff;
            box-shadow: 0 0 10px #8caaff;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }

        /* Contenido principal */
        main {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px;
            text-align: center;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 800;
            letter-spacing: -0.065em;
            line-height: 1.15;
            background: linear-gradient(
                110deg,
                #ffffff 10%,
                #c7d2fe 40%,
                #67e8f9 65%,
                #ffffff 90%
            );
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px #8b5cf655);
            animation:
                appear 1.3s cubic-bezier(.2,.8,.2,1) both,
                shine 6s linear 1.3s infinite;
        }

        /* Anillos luminosos */
        .ring {
            position: absolute;
            width: min(80vw, 680px);
            height: min(32vw, 240px);
            min-height: 130px;
            border: 1px solid #9b8aff35;
            border-radius: 50%;
            transform: rotate(-12deg);
            animation: ringPulse 5s ease-in-out infinite;
        }

        .ring-two {
            width: min(88vw, 760px);
            height: min(38vw, 290px);
            border-color: #67e8f925;
            transform: rotate(12deg);
            animation-delay: -2.5s;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(28px) scale(.94);
                filter: blur(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(12vw, 8vh) scale(1.25); }
        }

        @keyframes twinkle {
            from { opacity: .15; transform: scale(.7); }
            to { opacity: 1; transform: scale(1.5); }
        }

        @keyframes ringPulse {
            0%, 100% { opacity: .35; scale: .96; }
            50% { opacity: .8; scale: 1.04; }
        }

        /* Respeta las preferencias de accesibilidad */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <div class="background" aria-hidden="true">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <div class="particles" id="particles"></div>
    </div>

    <main>
        <div class="ring" aria-hidden="true"></div>
        <div class="ring ring-two" aria-hidden="true"></div>
        <h1>Hola Mundo</h1>
    </main>

    <script>
        const container = document.getElementById("particles");
        const reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        const amount = window.innerWidth < 600 ? 35 : 70;

        for (let i = 0; i < amount; i++) {
            const particle = document.createElement("span");
            particle.className = "particle";

            particle.style.left = Math.random() * 100 + "%";
            particle.style.top = Math.random() * 100 + "%";
            particle.style.setProperty(
                "--duration",
                (2 + Math.random() * 4) + "s"
            );
            particle.style.setProperty(
                "--delay",
                (-Math.random() * 5) + "s"
            );

            if (reduceMotion) {
                particle.style.animation = "none";
            }

            container.appendChild(particle);
        }
    </script>

</body>
</html>
